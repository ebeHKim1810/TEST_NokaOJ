# ==============================================================================
# Noka JUDGE — Development Docker Compose (Windows Docker Desktop + WSL2 / Linux)
# ==============================================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-noka_judge}
      POSTGRES_USER: ${POSTGRES_USER:-noka_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noka_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noka_user} -d ${POSTGRES_DB:-noka_judge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-noka_user}:${POSTGRES_PASSWORD:-noka_dev_password}@postgres:5432/${POSTGRES_DB:-noka_judge}
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /app/storage
      JUDGE_MODE: local_posix
    volumes:
      - ./storage:/app/storage
      - ./backend:/app/backend
      - ./judge:/app/judge
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  judge-worker:
    build:
      context: .
      dockerfile: judge/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-noka_user}:${POSTGRES_PASSWORD:-noka_dev_password}@postgres:5432/${POSTGRES_DB:-noka_judge}
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /app/storage
      JUDGE_MODE: local_posix
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_APP_NAME: ${VITE_APP_NAME:-Noka JUDGE}
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
